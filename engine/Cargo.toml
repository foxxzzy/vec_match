[package]
name = "matching-engine-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4.42", features = ["serde"] }
dotenv = "0.15.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1.47.0", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
tower = "0.5"
